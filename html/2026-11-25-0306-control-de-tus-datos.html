<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="jdt.css"></head>
<body>
<!-- Escena 1: gancho amarillo, un solo icono de base de datos gigante -->
<div id="e1" class="capa" style="background:#FACC15;color:#0A0E27">
  <div id="t1" class="titulo" style="position:absolute;left:70px;right:70px;top:300px;font-size:118px;text-align:left">Lo que nadie te cuenta de <span style="background:#0A0E27;color:#FACC15;padding:0 14px">tus datos</span></div>
  <div id="db1" style="position:absolute;left:250px;top:960px;width:580px;height:620px">
    <div style="position:absolute;left:0;right:0;top:0;height:150px;border-radius:50%;background:#0A0E27"></div>
    <div style="position:absolute;left:0;right:0;top:75px;height:330px;background:#0A0E27"></div>
    <div style="position:absolute;left:0;right:0;top:330px;height:150px;border-radius:50%;background:#0A0E27"></div>
    <div style="position:absolute;left:0;right:0;top:165px;height:12px;background:#FACC15"></div>
    <div style="position:absolute;left:0;right:0;top:330px;height:12px;background:#FACC15"></div>
    <div style="position:absolute;left:0;right:0;top:495px;height:12px;background:#FACC15"></div>
  </div>
</div>

<!-- Escena 2: azul, tres piezas regadas que luego viajan al centro -->
<div id="e2" class="capa" style="background:#0A0E27">
  <div style="position:absolute;inset:0;background:#0D1230"></div>
  <div id="t2" class="titulo" style="position:absolute;left:70px;right:70px;top:250px;font-size:96px;color:#FFFFFF">Una hoja, un correo, <span class="clave">un chat</span></div>
  <div id="c2a" class="tarjeta" style="left:90px;top:700px;width:460px;height:300px;transform:rotate(-8deg)"><div class="mono">Clientes</div><div class="linea"></div><div class="linea corta"></div><div class="linea"></div></div>
  <div id="c2b" class="tarjeta" style="left:420px;top:1020px;width:460px;height:300px;transform:rotate(5deg)"><div class="mono">Pedidos</div><div class="linea"></div><div class="linea corta"></div><div class="linea"></div></div>
  <div id="c2c" class="tarjeta" style="left:150px;top:1340px;width:460px;height:300px;transform:rotate(-3deg)"><div class="mono">Precios</div><div class="linea"></div><div class="linea corta"></div><div class="linea"></div></div>
</div>

<!-- Escena 3: amarillo quieto, un signo de pregunta gigante -->
<div id="e3" class="capa" style="background:#FACC15;color:#0A0E27">
  <div id="q3" class="titulo" style="position:absolute;left:0;right:0;top:520px;text-align:center;font-size:620px;line-height:1">?</div>
  <div id="t3" class="titulo" style="position:absolute;left:70px;right:70px;top:1260px;text-align:center;font-size:104px">¿Quién <span style="background:#0A0E27;color:#FACC15;padding:0 12px">controla</span> tus datos?</div>
</div>

<!-- Escena 4: azul, las piezas se juntan en un anillo con barras que se llenan -->
<div id="fl"></div>
<div id="e4" class="capa" style="background:#0A0E27">
  <div style="position:absolute;inset:0;background:#0D1230"></div>
  <div id="ring4" style="position:absolute;left:240px;top:560px;width:600px;height:600px;border-radius:50%;border:40px solid #131A3A"></div>
  <div id="arc4" style="position:absolute;left:240px;top:560px;width:600px;height:600px;border-radius:50%;border:40px solid #FACC15;border-right-color:transparent;border-bottom-color:transparent"></div>
  <div id="carp4" class="tarjeta" style="left:390px;top:800px;width:300px;height:220px;background:#FACC15;border-color:#FACC15;color:#0A0E27"><div class="mono" style="color:#0A0E27;font-size:44px;letter-spacing:.02em;text-transform:none;font-weight:800">Todo en un lugar</div></div>
  <div style="position:absolute;left:150px;top:1290px;width:780px">
    <div class="barra-w"><i id="b4a"></i></div><div class="barra-w"><i id="b4b"></i></div><div class="barra-w"><i id="b4c"></i></div>
  </div>
  <div id="t4" class="titulo" style="position:absolute;left:70px;right:70px;top:1520px;text-align:center;font-size:96px;color:#FFFFFF"><span class="clave">JDT</span>: software a medida</div>
</div>

<!-- Escena 5: amarillo, escudo con check -->
<div id="e5" class="capa" style="background:#FACC15;color:#0A0E27">
  <div id="sh5" style="position:absolute;left:300px;top:560px;width:480px;height:560px;background:#0A0E27;clip-path:polygon(50% 0,100% 14%,100% 56%,50% 100%,0 56%,0 14%)"></div>
  <div id="ck5" style="position:absolute;left:430px;top:720px;width:220px;height:120px;border-left:40px solid #FACC15;border-bottom:40px solid #FACC15;transform:rotate(-45deg)"></div>
  <div id="t5" class="titulo" style="position:absolute;left:70px;right:70px;top:1280px;text-align:center;font-size:104px">Tú decides <span style="background:#0A0E27;color:#FACC15;padding:0 12px">quién ve qué</span></div>
</div>

<!-- Escena 6: cierre -->
<div id="e6" class="capa" style="background:#0A0E27">
  <img id="logo6" src="../recursos/logo.jpeg" style="position:absolute;left:290px;top:520px;width:500px;border-radius:90px">
  <div id="c6" class="titulo" style="position:absolute;left:0;right:0;top:1120px;text-align:center;font-size:112px">Hablemos<br>de tu <span class="oro">proyecto.</span></div>
  <div id="h6" style="position:absolute;left:0;right:0;top:1480px;text-align:center"><span class="pildora">@technologicsjdt</span></div>
</div>

<style>
.tarjeta{position:absolute;border-radius:28px;background:#131A3A;border:3px solid #2A3460;padding:36px;color:#FFFFFF}
.tarjeta .linea{height:16px;border-radius:8px;background:#94A3B8;margin-top:26px;width:100%}
.tarjeta .linea.corta{width:55%}
.tarjeta .mono{color:#FACC15;font-size:56px;font-weight:800;letter-spacing:0;text-transform:none}
#fl{position:absolute;inset:0;background:#FACC15;opacity:0;z-index:9}
.barra-w{height:26px;border-radius:13px;background:#131A3A;margin-bottom:28px;overflow:hidden}
.barra-w i{display:block;height:100%;width:0;background:#FACC15;border-radius:13px}
.capa{overflow:hidden}
</style>

<script>
const $ = id => document.getElementById(id);
window.DURACION = 24.0;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => { const k = clamp((t - a) / (b - a)); return 1 - Math.pow(1 - k, 3); };
const dentro = (t, a, b) => t >= a && t < b;
const ESCENAS = [["e1", 0, 5.35], ["e2", 5.35, 9.66], ["e3", 9.66, 13.91], ["e4", 13.91, 19.18], ["e5", 19.18, 22.46], ["e6", 22.46, 24.0]];

window.render = (t) => {
  ESCENAS.forEach(([id, a, b]) => $(id).style.display = dentro(t, a, b) ? "block" : "none");

  // E1 gancho: titular se revela desde t=0 y el icono de datos entra con un leve rebote
  $("t1").style.opacity = 1;
  $("db1").style.transform = `scale(${0.85 + 0.15 * seg(t, .1, .9)})`;

  // E2 tres piezas que se acomodan y luego viajan al centro (6,2 a 9,6 s) y se pierden
  const k2 = seg(t, 6.3, 8.6);
  $("t2").style.opacity = seg(t, 5.35, 5.8);
  ["c2a", "c2b", "c2c"].forEach((id, i) => {
    const el = $(id), base = [[90, 700], [420, 1020], [150, 1340]][i];
    const dx = (300 - base[0]) * k2 + i * 0, dy = (1000 - base[1]) * k2 * .9 + i * 0;
    el.style.opacity = 1;
    el.style.transform = `translate(${dx}px,${dy}px) rotate(${[-8, 5, -3][i] * (1 - k2)}deg)`;
  });

  // E3 pregunta quieta: sin movimiento en el momento clave
  $("q3").style.opacity = seg(t, 9.66, 10.1);
  $("t3").style.opacity = seg(t, 9.66, 9.9);

  // E4 anillo que se dibuja y barras que se llenan en orden
  const arc = seg(t, 13.91, 15.3);
  $("arc4").style.transform = `rotate(${-90 + 360 * arc}deg)`;
  $("carp4").style.opacity = seg(t, 14.0, 14.5);
  $("b4a").style.width = (100 * seg(t, 14.4, 15.4)) + "%";
  $("b4b").style.width = (100 * seg(t, 15.2, 16.2)) + "%";
  $("b4c").style.width = (100 * seg(t, 16.0, 17.0)) + "%";
  $("t4").style.opacity = seg(t, 14.1, 14.5);

  $("fl").style.opacity = (t >= 13.91 && t < 14.06) ? 0.85 : 0;

  // E5 escudo y check (dibuja el check al final)
  $("sh5").style.transform = `scale(${0.9 + 0.1 * seg(t, 19.2, 19.8)})`;
  $("ck5").style.opacity = seg(t, 20.2, 20.6);
  $("t5").style.opacity = seg(t, 19.6, 20.1);

  // E6 cierre: logo, CTA y @ de marca
  $("logo6").style.opacity = seg(t, 22.46, 22.8);
  $("c6").style.opacity = seg(t, 22.46, 22.9);
  $("h6").style.opacity = seg(t, 23.0, 23.4);
};
</script>
</body></html>
