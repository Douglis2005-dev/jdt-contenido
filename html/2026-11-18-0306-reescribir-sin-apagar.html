<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="jdt.css"><script src="jdt.js"></script></head>
<body>
<div id="e1" class="capa">
  <div id="t1" class="titulo" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:104px"></div>
  <div id="p1" class="vidrio" style="left:250px;top:700px;width:580px;height:560px;padding:50px;text-align:center">
    <div class="mono">sistema actual</div>
    <div id="n1" class="titulo" style="font-size:112px;margin-top:70px;color:#FACC15">NO TOCAR</div>
    <div class="titulo" style="font-size:38px;margin-top:40px;color:#94A3B8;white-space:nowrap">funciona · no se toca</div>
  </div>
</div>
<div id="e2" class="capa">
  <div id="w2" class="titulo" style="position:absolute;left:0;right:0;top:700px;text-align:center;font-size:150px"></div>
  <div id="s2" class="mono" style="position:absolute;left:0;right:0;top:1260px;text-align:center;font-size:44px;color:#FFFFFF"></div>
</div>
<div id="e3" class="capa">
  <div id="ojo" style="position:absolute;left:290px;top:640px;width:500px;height:500px"></div>
  <div id="t3" class="titulo" style="position:absolute;left:0;right:0;top:420px;text-align:center;font-size:80px">Primero, <span class="clave">grábalo</span></div>
  <div id="rec" class="mono" style="position:absolute;left:0;right:0;top:1230px;text-align:center;font-size:34px;white-space:nowrap;color:#FACC15">● REC · graba lo que hace hoy</div>
</div>
<div id="e4" class="capa">
  <div id="fila" style="position:absolute;left:0;top:820px;width:1080px;height:300px"></div>
  <div id="flecha" style="position:absolute;left:0;top:1190px;width:1080px;text-align:center"><span class="pildora" id="pg">Todo sigue andando</span></div>
  <div id="titulo4" class="titulo" style="position:absolute;left:0;right:0;top:420px;text-align:center;font-size:96px"></div>
</div>
<div id="e5" class="capa">
  <div id="t5" class="titulo" style="position:absolute;left:0;right:0;top:420px;text-align:center;font-size:110px">Modernizamos<br><span class="clave">por partes</span></div>
  <div id="ruido" class="vidrio" style="left:520px;top:1300px;width:480px;height:200px;opacity:0;background:rgba(148,163,184,.6);transform:rotate(12deg)"></div>
  <div id="card5" class="vidrio oro" style="left:200px;top:880px;width:680px;height:300px;padding:40px;text-align:center">
    <div class="titulo" style="position:absolute;left:0;right:0;top:95px;text-align:center;font-size:70px;color:#FFFFFF;z-index:3">Software a medida</div>
  </div>
</div>
<div id="e6" class="capa">
  <div id="c6" class="titulo" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-size:128px">Hablemos<br>de tu <span class="oro">proyecto</span></div>
  <div style="position:absolute;left:0;right:0;top:1200px;text-align:center"><span class="pildora">@technologicsjdt</span></div>
</div>
<div id="hud" class="hud"></div><div id="fl" class="capa" style="background:#fff;opacity:0;z-index:7"></div>
<script>
const {seg, E, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0), fg = JDT.lienzo(5);
window.DURACION = 25.42;
const dentro = (t, a, b) => t >= a && t < b;
const CAP = [0, 3.51, 6.71, 10.78, 17.66, 22.99, 25.42];
const NOMBRES = ["01 · SISTEMA", "02 · LA REGLA", "03 · LA GRABACIÓN", "04 · POR PIEZAS", "05 · JDT", "06 · CIERRE"];
window.render = (t) => {
  const ids = ["e1", "e2", "e3", "e4", "e5", "e6"];
  ids.forEach((id, i) => $(id).style.display = dentro(t, CAP[i], CAP[i + 1]) ? "block" : "none");
  JDT.fondo(bg, t);
  // E1: titular y tarjeta de vidrio con el letrero NO TOCAR
  if (dentro(t, 0, 3.51)) {
    $("t1").innerHTML = 'Ese sistema <span class="clave">viejo</span>'; JDT.revelar($("t1"), seg(t, .2, 1.1, "outExpo"));
    JDT.camara($("p1"), {ry: lerp(-14, 0, seg(t, 0, 2.5, "inOutCubic")), rx: 6, y: lerp(90, 0, seg(t, .3, 1.2)), s: lerp(.94, 1, seg(t, 0, 1.2))});
    $("p1").style.opacity = seg(t, .4, 1.1, "lineal");
    $("n1").style.transform = `rotate(${Math.sin(t * 2.2) * 6 * seg(t, .6, 1.4)}deg)`;
  }
  // E2: marquesina de palabras con golpe de glitch (un solo efecto fuerte)
  if (dentro(t, 3.51, 6.71)) {
    const ws = ["NO TOCAR", "NO APAGAR", "NI RESPIRAR"];
    const i = Math.min(2, Math.floor((t - 3.51) / 1.05));
    $("w2").textContent = ws[i];
    JDT.desenfoque($("w2"), 12 * (1 - seg(t, 3.51 + i * 1.05, 3.51 + i * 1.05 + .25)));
    $("w2").style.transform = `translateX(${Math.sin(t * 40) * 4 * (1 - seg(t, 3.51, 4.2))}px)`;
    $("s2").textContent = "«si lo apagamos, se para todo»";
  }
  // E3: ojo que graba la pantalla con punto REC que late (look amarillo)
  if (dentro(t, 6.71, 10.78)) {
    const k = seg(t, 6.71, 7.6, "outExpo"); JDT.revelar($("t3"), seg(t, 6.8, 7.6, "outExpo"));
    $("ojo").innerHTML = `<div style="position:absolute;inset:0;border-radius:50%;border:14px solid #0A0E27;background:#FACC15;transform:scale(${lerp(.4, 1, k)})"></div>
      <div style="position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px;border-radius:50%;background:#0A0E27;transform:scale(${1 + .06 * Math.sin(t * 6)})"></div>`;
    $("rec").style.opacity = 0.8 + 0.2 * Math.sin(t * 6);
  }
  // E4: fila de piezas grises; entra una pieza amarilla nueva que ocupa su puesto
  if (dentro(t, 10.78, 17.66)) {
    const n = 5, ancho = 180;
    const k = seg(t, 11.2, 12.4, "outExpo");
    let h = "";
    for (let i = 0; i < n; i++) {
      const x = 80 + i * ancho, nueva = i === 2;
      const dy = nueva ? lerp(-260, 0, seg(t, 13.6, 14.7, "outBack")) : 0;
      h += `<div class="vidrio" style="position:absolute;left:${x}px;top:${dy}px;width:${ancho - 24}px;height:200px;background:${nueva ? "rgba(250,204,21,.85)" : "rgba(148,163,184,.25)"};transform:scale(${lerp(.6, 1, k)})"></div>`;
    }
    $("fila").innerHTML = h;
    $("titulo4").innerHTML = 'Una pieza <span class="clave">a la vez</span>';
    JDT.revelar($("titulo4"), seg(t, 11, 11.9, "outExpo"));
    $("pg").style.opacity = seg(t, 15, 15.7, "lineal");
    JDT.camara($("fila"), {rx: 0, ry: lerp(0, 4, seg(t, 10.8, 17.6)), y: 0, s: 1});
  }
  // E5: JDT como quien lo resuelve; tarjeta dorada
  if (dentro(t, 17.66, 22.99)) {
    JDT.revelar($("t5"), seg(t, 17.7, 18.6, "outExpo"));
    $("card5").style.opacity = seg(t, 18.4, 19.2, "lineal");
    $("ruido").style.opacity = 0.6 * seg(t, 19.2, 19.6, "lineal");
    $("ruido").style.transform = `translateY(${lerp(-200, 0, seg(t, 19.2, 19.9, "outBack"))}px) rotate(12deg)`;
    $("card5").style.transform = `translateY(${lerp(60, 0, seg(t, 18.4, 19.4, "outExpo"))}px)`;
  }
  // E6: cierre
  if (dentro(t, 22.99, 25.42)) {
    $("c6").style.opacity = seg(t, 23.1, 23.8, "outQuart");
    $("c6").style.transform = `translateY(${lerp(60, 0, seg(t, 23.1, 24, "outExpo"))}px)`;
  }
  // barridos entre capitulos y destello (solo uno fuerte)
  let kb = 0; [CAP[1], CAP[4]].forEach(x => { if (t > x - .4 && t < x + .4) kb = (t - (x - .4)) / .8; });
  fg.clearRect(0, 0, JDT.W, JDT.H); JDT.barrido(fg, kb); 
  JDT.flash($("fl"), 0);
  JDT.hud($("hud"), t, 25.42, NOMBRES[Math.max(0, CAP.slice(0, -1).findLastIndex(x => t >= x))]);
};
</script></body></html>
