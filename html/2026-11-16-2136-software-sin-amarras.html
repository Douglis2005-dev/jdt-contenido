<script>
const {seg, E, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0), fg = JDT.lienzo(5);
window.DURACION = 25;
const dentro = (t,a,b)=>t>=a&&t<b;
const L1 = JDT.letras($("t1"), "¿Puedes mudar tu software?");
{const sp=$("t1").children;sp[11].after(document.createElement("br"));}
const CODIGO='<b class="k">app</b>.<b class="n">desplegar</b>({\n  destino: <b class="s">"el que tú elijas"</b>,\n  datos: <b class="s">"tuyos"</b>,\n});';
const pal4=["DATOS","REGLAS","CONTROL"];
window.render = (t) => {
  const esc=[["e1",0,4.4],["e2",4.2,9.0],["e3",8.8,17.0],["e4",16.8,19.8],["e5",19.5,25]];
  esc.forEach(([id,a,b])=>$(id).style.display=dentro(t,a,b)?"block":"none");
  bg.clearRect(0,0,JDT.W,JDT.H); JDT.fondo(bg,t);
  const H_=JDT.H, W_=JDT.W;
  if(dentro(t,0,4.4)){
    JDT.metaballs(bg,t,{x:.5,y:.58,r:260,n:4,k:seg(t,0,1,"outBack")});
    L1.forEach((s,i)=>{const k=seg(t,.05+i*.025,.45+i*.025,"outBack");s.style.opacity=k;s.style.transform=`translateY(${(1-k)*60}px)`;
      if(t>1.0 && /mudar/.test("¿Puedes mudar tu software?".slice(Math.max(0,i-0),i+1)) ){} });
    JDT.camara($("p1"),{ry:lerp(-30,-10,seg(t,0,3.4,"inOutCubic")),rx:8,y:lerp(160,0,seg(t,0,.8)),s:lerp(.85,1,seg(t,0,.8))});
    // el candado tiembla tratando de abrirse; la argolla se levanta un poco y cae
    const tem=Math.sin(t*38)*seg(t,1.2,2.4,"lineal")*(t<3.2?1:0)*6;
    $("c1").style.transform=`translateX(${tem}px) rotate(${tem*.4}deg)`;
    $("s1").setAttribute("transform",`translate(0,${-6*Math.abs(Math.sin(t*7))*seg(t,1.2,1.8,"lineal")})`);
    JDT.glitch($("p1"),(t>2.1&&t<2.5)?1:0,Math.floor(t*30));
  }
  if(dentro(t,4.2,9.0)){
    const u=t-4.2;
    $("t2").style.opacity=seg(t,4.4,4.9,"outQuart"); JDT.revelar($("t2"),seg(t,4.4,5.1,"outExpo"));
    JDT.camara($("cen2"),{ry:lerp(-14,14,seg(t,4.2,8.8,"inOutCubic")),rx:6,s:lerp(.7,1,seg(t,4.3,5,"outBack"))});
    // cadenas desde 4 apps hacia el centro (canvas)
    const nodos=[[.16,.30],[.84,.30],[.14,.80],[.86,.80]];
    nodos.forEach(([x,y],i)=>{const k=seg(t,5+i*.35,5.8+i*.35,"outExpo");
      const X=W_*x,Y=H_*y*.82+260*.2+420*(i<2?0:0.0);const cx=W_/2,cy=1010;
      bg.save();bg.strokeStyle="rgba(250,204,21,.8)";bg.lineWidth=7;bg.setLineDash([26,14]);bg.lineDashOffset=-t*40;
      bg.beginPath();bg.moveTo(X,Y);bg.lineTo(lerp(X,cx,k),lerp(Y,cy,k));bg.stroke();bg.restore();
      bg.fillStyle="rgba(255,255,255,.14)";bg.strokeStyle="rgba(255,255,255,.4)";bg.lineWidth=3;
      bg.beginPath();bg.roundRect(X-90,Y-60,180,120,24);bg.fill();bg.stroke();
      bg.fillStyle="#fff";bg.font="800 36px Montserrat";bg.textAlign="center";bg.fillText(["APP","DATOS","WEB","PAGOS"][i],X,Y+13);});
    // tags de costo subiendo
    for(let i=0;i<6;i++){const q=((t*.5+i/6)%1);bg.fillStyle=`rgba(250,204,21,${(1-q)*.9*seg(t,6,6.6,"lineal")})`;bg.font="900 64px Montserrat";bg.textAlign="center";bg.fillText("$",W_*(.3+i*.08)+Math.sin(i)*20,1260-q*260);}
    // sello ¡A PAGAR!
    const s=seg(t,7.95,8.25,"outBack");
    $("st2").textContent="¡A PAGAR!";$("st2").style.opacity=t>7.95?1:0;$("st2").style.transform=`rotate(-5deg) scale(${lerp(2.6,1,s)})`;
    if(t>7.95&&t<8.35)JDT.glitch($("st2"),.7,Math.floor(t*30));else $("st2").style.filter="none";
  }
  if(dentro(t,8.8,17.0)){
    JDT.rejilla(bg,t,{camino:seg(t,10,15,"inOutCubic"),alfa:seg(t,8.9,9.8,"outExpo"),horizonte:H_*.36});
    $("t3").style.opacity=seg(t,9.0,9.5,"outQuart");JDT.revelar($("t3"),seg(t,9.0,9.8,"outExpo"));
    JDT.camara($("p3"),{ry:lerp(-20,-6,seg(t,8.8,13,"inOutCubic")),rx:6,y:lerp(140,0,seg(t,9,10)),s:lerp(.9,1,seg(t,9,10))});
    $("p3").style.opacity=seg(t,9.1,9.6,"lineal");JDT.tipear($("c3"),CODIGO,seg(t,9.6,12.0,"lineal"));
    [["k1",12.2],["k2",12.9],["k3",13.6]].forEach(([id,a],i)=>{const k=seg(t,a,a+.7,"outBack");const e=$(id);e.style.opacity=clamp(k*2);
      e.style.transform=`translateX(${(1-k)*(i%2?-1:1)*900}px)`;JDT.desenfoque(e,12*(1-seg(t,a,a+.5)));});
    $("ok3").style.opacity=seg(t,14.8,15.2,"lineal");$("ok3").style.transform=`scale(${lerp(.6,1,seg(t,14.8,15.4,"outBack"))})`;
  }
  if(dentro(t,16.8,19.8)){
    JDT.metaballs(bg,t,{x:.5,y:.3,r:330,n:4,k:seg(t,16.8,17.8,"outBack")});
    const k=seg(t,17.0,17.6,"outBack");$("c4").style.transform=`scale(${lerp(.3,1.1,k)})`;$("c4").style.opacity=clamp(k*2);
    const ab=seg(t,17.4,18.0,"outExpo");$("s4").setAttribute("transform",`translate(60,${-44*ab}) rotate(${ -55*ab} 150 100)`);
    const i=Math.min(2,Math.floor(Math.max(0,t-17.5)/.75));$("w4").textContent=t<17.5?"":pal4[i];
    $("w4").style.color=i==2?"#FACC15":"#fff";JDT.desenfoque($("w4"),14*(1-seg(t,17.5+i*.75,17.5+i*.75+.2)));
    $("s4t").textContent=t>18.5?"// tuyo, a tu manera":"";
  }
  if(dentro(t,19.5,25)){
    const ab=1-seg(t,19.6,20.6,"outExpo");JDT.glitch($("logo"),ab,Math.floor(t*30));$("logo").style.opacity=seg(t,19.5,19.75,"lineal");
    $("n5").style.letterSpacing=".3em";$("n5").textContent="JDT TECHNOLOGICS".slice(0,Math.round(16*seg(t,20.6,21.8,"lineal")));
    $("c6").style.opacity=seg(t,22.5,23.1,"outQuart");$("c6").style.transform=`translateY(${lerp(60,0,seg(t,22.5,23.3,"outExpo"))}px)`;
    $("ig").style.opacity=seg(t,23.6,24,"lineal");
    JDT.rejilla(bg,t,{alfa:.5*seg(t,19.6,20.6),horizonte:H_*.55});
  }
  const b=[4.2,8.8,16.8,19.5];let kb=0;b.forEach(x=>{if(t>x&&t<x+.8)kb=(t-x)/.4;});
  fg.clearRect(0,0,JDT.W,JDT.H);JDT.barrido(fg,kb);JDT.grano(fg,t,.05);
  JDT.flash($("fl"),t>7.95&&t<8.2?1-(t-7.95)/.25:(t>19.5&&t<19.7?1-(t-19.5)/.2:0));
  JDT.hud($("hud"),t,25,["01 · LA PREGUNTA","02 · EL PROBLEMA","03 · LA SALIDA","04 · TU CONTROL","05 · JDT"][Math.max(0,esc.findLastIndex(([,a])=>t>=a))]);
};
