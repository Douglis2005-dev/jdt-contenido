<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="jdt.css"><script src="jdt.js"></script>
<style>
  .tarjeta{position:absolute;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
    border:2px solid rgba(255,255,255,.26);backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:46px;color:#fff;padding:20px}
  .tarjeta.dorada{background:linear-gradient(145deg,rgba(250,204,21,.32),rgba(234,179,8,.08));border-color:rgba(250,204,21,.6)}
  .tarjeta.oscura{background:rgba(10,14,39,.72);border-color:rgba(148,163,184,.35)}
  .fila{position:absolute;left:-300px;white-space:nowrap;font-weight:900;font-size:150px;letter-spacing:-.03em;line-height:1.05}
  .amarillo-fondo{position:absolute;inset:0;background:#FACC15}
</style></head><body>
<!-- E1 hook: resultado primero -->
<div id="e1" class="capa">
  <div style="position:absolute;left:-120px;top:-40px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(84,102,180,.55),rgba(84,102,180,0) 70%)"></div><div style="position:absolute;left:640px;top:820px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(250,204,21,.35),rgba(250,204,21,0) 70%)"></div><div style="position:absolute;left:50px;top:200px;width:980px;height:460px;border-radius:44px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(20px)"></div><div id="h1" class="titulo" style="position:absolute;left:70px;right:70px;top:250px;text-align:center;font-size:118px;line-height:1.02"></div>
  <div id="pa" class="tarjeta dorada" style="left:110px;top:700px;width:860px;height:150px">CRM al día</div>
  <div id="pb" class="tarjeta" style="left:110px;top:900px;width:860px;height:150px">ERP al día</div>
  <div id="pc" class="tarjeta" style="left:110px;top:1100px;width:860px;height:150px">Contabilidad cuadrada</div>
</div>
<!-- E2 giro: copiar y pegar en bucle -->
<div id="e2" class="capa">
  <div id="fa" class="fila" style="top:520px;color:#fff"></div>
  <div id="fb" class="fila" style="top:900px;color:#FACC15"></div>
  <div id="fc" class="fila" style="top:1280px;color:#94A3B8"></div>
</div>
<!-- E3 tension: tu eres el cable -->
<div id="e3" class="capa">
  <svg id="lineas" style="position:absolute;inset:0" width="1080" height="1920"></svg>
  <div id="anillo" style="position:absolute;left:340px;top:700px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(250,204,21,.35),rgba(84,102,180,.18) 60%,rgba(10,14,39,0) 72%);border:3px solid rgba(250,204,21,.55)"></div>
  <div id="cable" class="titulo" style="position:absolute;left:340px;top:855px;width:400px;text-align:center;font-size:96px">TÚ</div>
  <div id="t3" class="titulo" style="position:absolute;left:70px;right:70px;top:300px;text-align:center;font-size:118px;line-height:1.02"></div>
  <div id="k1" class="tarjeta oscura" style="left:70px;top:1200px;width:300px;height:140px;font-size:38px">CRM</div>
  <div id="k2" class="tarjeta oscura" style="left:390px;top:1200px;width:300px;height:140px;font-size:38px">ERP</div>
  <div id="k3" class="tarjeta oscura" style="left:710px;top:1200px;width:300px;height:140px;font-size:34px">Contabilidad</div>
</div>
<!-- E4 apoyo: pantalla dividida, hoy vs con API -->
<div id="e4" class="capa">
  <div id="mitadA" style="position:absolute;left:0;right:0;top:0;height:960px;background:#0D1230"></div>
  <div id="mitadB" style="position:absolute;left:0;right:0;top:960px;height:960px;background:#FACC15"></div>
  <div id="dA" class="mono" style="position:absolute;left:70px;top:230px;font-size:34px">HOY · a mano</div>
  <div id="dB" class="mono" style="position:absolute;left:70px;top:1110px;font-size:34px;color:#0A0E27">CON API · automático</div>
  <div id="tA" class="titulo" style="position:absolute;left:70px;right:70px;top:300px;font-size:104px;line-height:1.05"></div>
  <div id="tB" class="titulo" style="position:absolute;left:70px;right:70px;top:1560px;font-size:84px;line-height:1.08;color:#0A0E27"></div>
  <div id="barras" style="position:absolute;left:70px;right:70px;top:620px;height:200px"></div>
  <svg id="enlace" style="position:absolute;left:70px;top:1260px" width="940" height="330"></svg>
</div>
<!-- E5 marca: JDT conecta -->
<div id="e5" class="capa">
  <div id="fondoE5" class="amarillo-fondo" style="display:none"></div>
  <svg id="flechas" style="position:absolute;inset:0" width="1080" height="1920"></svg>
  <div id="hub" style="position:absolute;left:390px;top:620px;width:300px;height:300px;border-radius:50%;background:#0A0E27;border:3px solid #0A0E27;box-shadow:0 30px 80px rgba(10,14,39,.35)"></div>
  <div id="hubt" class="titulo" style="position:absolute;left:390px;top:712px;width:300px;text-align:center;font-size:56px;color:#FACC15">JDT</div>
  <div id="e5a" class="tarjeta" style="background:#0A0E27;border-color:#0A0E27;color:#FFFFFF;left:90px;top:1080px;width:400px;height:130px;font-size:38px">CRM</div>
  <div id="e5b" class="tarjeta" style="background:#0A0E27;border-color:#0A0E27;color:#FFFFFF;left:590px;top:1080px;width:400px;height:130px;font-size:38px">ERP</div>
  <div id="e5c" class="tarjeta" style="background:#0A0E27;border-color:#0A0E27;color:#FFFFFF;left:340px;top:1280px;width:400px;height:130px;font-size:38px">Contabilidad</div>
  <div id="t5" class="titulo" style="position:absolute;left:70px;right:70px;top:220px;text-align:center;font-size:110px;line-height:1.02"></div>
  <div id="s5" class="mono" style="position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:40px"></div>
</div>
<!-- E6 cierre -->
<div id="e6" class="capa">
  <div id="t6" class="titulo" style="position:absolute;left:0;right:0;top:650px;text-align:center;font-size:132px;line-height:1.02"></div>
  <div id="pild" style="position:absolute;left:0;right:0;top:1140px;text-align:center"><span class="pildora">@technologicsjdt</span><div class="mono" style="margin-top:40px;font-size:34px;color:#FFFFFF">Te respondemos en menos de 24 horas</div></div>
</div>
<div id="fondoCapa" class="capa"></div>
<div id="persiana" style="position:absolute;left:0;right:0;top:0;height:0;background:#FACC15;z-index:4"></div>
<div id="fl" class="capa" style="background:#fff;opacity:0;z-index:7"></div>
<div id="hud" class="hud"><i class="esq" style="left:40px;top:40px;border-width:3px 0 0 3px"></i><i class="esq" style="right:40px;top:40px;border-width:3px 3px 0 0"></i><i class="esq" style="left:40px;bottom:40px;border-width:0 0 3px 3px"></i><i class="esq" style="right:40px;bottom:40px;border-width:0 3px 3px 0"></i><div class="marca mono">JDT</div><div class="tc mono"></div><div class="esc mono"></div><div class="barra"><i></i></div></div>
<script>
const {seg, E, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0), fg = JDT.lienzo(5);
window.DURACION = 23.57;
const dentro = (t, a, b) => t >= a && t < b;
const ESC = [["e1",0,3.4],["e2",3.4,8.43],["e3",8.43,11.65],["e4",11.65,14.94],["e5",14.94,19.94],["e6",19.94,23.57]];
const L = (s, a, b) => clamp((s - a) / (b - a));
window.render = (t) => {
  ESC.forEach(([id,a,b]) => $(id).style.display = dentro(t,a,b) ? "block" : "none");
  // fondo: el look amarillo solo en la escena 5
  const amarillo = dentro(t, 14.94, 19.94);
  $("fondoE5").style.display = amarillo ? "block" : "none";
  if (!amarillo) JDT.fondo(bg, t); else bg.clearRect(0,0,JDT.W,JDT.H);

  // E1 hook: titular visible desde t=0 y tarjetas que se alinean; camara que empuja
  if (dentro(t,0,3.4)) {
    $("h1").innerHTML = 'Así se ve <span class="clave">cuando se hablan</span>';
    JDT.revelar($("h1"), seg(t,0,.5,"outExpo"), "arriba");
    const e = seg(t,0,1.0,"outBack");
    JDT.camara($("e1"), {s: lerp(1.04, 1, seg(t,0,2.5,"outExpo"))});
    ["pa","pb","pc"].forEach((id) => { $(id).style.opacity = 1; $(id).style.transform = "none"; });
  }
  // E2 giro: marquesinas de copiar/pegar con glitch solo al entrar
  if (dentro(t,3.4,8.43)) {
    const k = L(t,3.4,3.9) ; const ks = 1 - seg(t,3.4,3.9,"outExpo");
    const dir = (x,s) => (t - 3.4) * 220 * s;
    $("fa").textContent = "COPIAR · PEGAR · COPIAR · PEGAR ";
    $("fb").textContent = "OTRA VEZ · REVISAR · OTRA VEZ ";
    $("fc").textContent = "ERP · CRM · ERP · CRM ";
    $("fa").style.transform = `translateX(${-300 + dir(0,1)}px)`;
    $("fb").style.transform = `translateX(${-(t - 3.4) * 280 - 200}px)`;
    $("fc").style.transform = `translateX(${-300 + dir(0,1)*.6}px)`;
    JDT.glitch($("e2"), ks, 5);
    if (t > 3.9) $("e2").style.filter = "none";
  }
  // E3 tension: el dueno como cable; lineas punteadas que laten
  if (dentro(t,8.43,11.65)) {
    $("t3").innerHTML = 'Tú eres <span class="clave">el cable</span>';
    JDT.revelar($("t3"), seg(t,8.5,9,"outExpo"), "arriba");
    const k = seg(t,8.6,9.2,"outExpo");
    const ln = $("lineas"); ln.innerHTML = "";
    const pts = [[120,1250],[540,1250],[860,1250]];
    pts.forEach(([x,y],i) => { const l = document.createElementNS("http://www.w3.org/2000/svg","line"); l.setAttribute("x1",540); l.setAttribute("y1",900); l.setAttribute("x2",x); l.setAttribute("y2",y-60); l.setAttribute("stroke","#FACC15"); l.setAttribute("stroke-width",4); l.setAttribute("stroke-dasharray","14 12"); l.setAttribute("stroke-dashoffset",-(t*60)); l.setAttribute("opacity",k); ln.appendChild(l); });
    $("anillo").style.transform = `scale(${lerp(.8,1,k)}) rotate(${(t-8.43)*40}deg)`;
    $("cable").style.opacity = k;
    ["k1","k2","k3"].forEach((id,i) => { $(id).style.opacity = clamp((t-8.43-i*.06)/.2); });
  }
  // E4 apoyo: pantalla dividida; arriba hojas desordenadas, abajo tres puntos unidos por una API
  if (dentro(t,11.65,14.94)) {
    $("tA").innerHTML = 'Copias <span class="clave">a mano</span>';
    $("tB").innerHTML = 'La API <span style="background:#0A0E27;color:#FACC15;padding:0 14px;border-radius:14px">los conecta</span>';
    JDT.revelar($("tA"), seg(t,11.8,12.4,"outExpo"));
    JDT.revelar($("tB"), seg(t,11.7,12.2,"outExpo"));
    const barras = $("barras");
    if (!barras.dataset.ok) {
      barras.innerHTML = [0,1,2].map(i => `<div style="position:absolute;left:${230+i*70}px;top:${20+i*26}px;width:300px;height:150px;border-radius:14px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)"></div>`).join("");
      barras.dataset.ok = 1;
    }
    const hojas = [...barras.children];
    hojas.forEach((h,i) => h.style.transform = `rotate(${(i-1)*lerp(0,12,seg(t,11.9,12.6,"outExpo"))}deg) translateX(${(i-1)*lerp(0,60,seg(t,11.9,12.6,"outExpo"))}px)`);
    // enlace: el segundo panel de la mitad amarilla (solo en la mitad inferior)
    const enl = $("enlace"); enl.innerHTML = "";
    const ptos = [[160,60],[540,20],[920,60]];
    ptos.forEach(([x,y],i) => { const c = document.createElementNS("http://www.w3.org/2000/svg","circle"); c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",26); c.setAttribute("fill", i==1 ? "#0A0E27" : "#0A0E27"); c.setAttribute("opacity", clamp((t-12.2-i*.2)/.3)); enl.appendChild(c); });
    [[0,1],[1,2]].forEach(([i,j],k) => { const l = document.createElementNS("http://www.w3.org/2000/svg","line"); l.setAttribute("x1",ptos[i][0]); l.setAttribute("y1",ptos[i][1]); l.setAttribute("x2",lerp(ptos[i][0],ptos[j][0],seg(t,12.6+k*.3,13.0+k*.3,"outExpo"))); l.setAttribute("y2",lerp(ptos[i][1],ptos[j][1],seg(t,12.6+k*.3,13.0+k*.3,"outExpo"))); l.setAttribute("stroke","#0A0E27"); l.setAttribute("stroke-width",8); enl.appendChild(l); });
    JDT.grano(fg, t, .03);
  }
  // E5 marca: fondo amarillo y hub de conexion; camara que se acerca
  if (dentro(t,14.94,19.94)) {
    const c = dentro(t,14.94,19.94);
    $("t5").innerHTML = '<span style="color:#0A0E27">JDT</span> conecta tus sistemas';
    JDT.revelar($("t5"), seg(t,15.1,15.7,"outExpo"), "arriba");
    $("t5").style.color = "#0A0E27";
    $("s5").innerHTML = '<span style="color:#0A0E27">Software a medida · por API</span>';
    $("s5").style.opacity = seg(t,16,16.6,"lineal");
    $("hub").style.opacity = seg(t,15.2,15.8,"lineal");
    $("hubt").style.opacity = $("hub").style.opacity;
    ["e5a","e5b","e5c"].forEach((id,i) => { $(id).style.opacity = clamp((t-15.4-i*.2)/.3); });
    const ln = $("flechas"); ln.innerHTML = "";
    [[290,1145],[790,1145],[540,1345]].forEach(([x,y],i) => { const l = document.createElementNS("http://www.w3.org/2000/svg","line"); l.setAttribute("x1",540); l.setAttribute("y1",770); l.setAttribute("x2",x); l.setAttribute("y2",y); l.setAttribute("stroke","#0A0E27"); l.setAttribute("stroke-width",6); l.setAttribute("stroke-dasharray",`${seg(t,15.6+i*.15,16.1+i*.15,"outExpo")*420} 420`); ln.appendChild(l); });
    JDT.camara($("e5"), {s: lerp(1, 1.04, L(t,14.94,19.94))});
  }
  // E6 cierre: persiana amarilla y llamado a la accion
  if (dentro(t,19.94,23.57)) {
    $("t6").innerHTML = 'Hablemos de <span class="clave">tu proyecto</span>';
    JDT.revelar($("t6"), seg(t,20.0,20.5,"outExpo"), "arriba");
    $("pild").style.opacity = seg(t,20.6,21.1,"lineal");
  }
  // persiana de cambio a la escena 6
  // persiana: cubre la escena 5 (19.6 a 20.1) y luego baja fuera del cuadro (20.1 a 20.6)
  const cubre = seg(t,19.6,19.95,"outExpo"), baja = seg(t,19.95,20.4,"inOutCubic");
  const alto = t < 19.95 ? cubre * 1920 : (1 - baja) * 1920;
  $("persiana").style.height = alto + "px";
  $("persiana").style.top = (t < 19.95 ? 0 : baja * 1920) + "px";
  // flash en el giro
  JDT.flash($("fl"), t > 3.3 && t < 3.45 ? 1 - (t - 3.3) / .15 : 0);
  JDT.hud($("hud"), t, 23.57, ["01 · HOOK","02 · GIRO","03 · TENSIÓN","04 · SOLUCIÓN","05 · JDT","06 · CIERRE"][Math.max(0, ESC.findLastIndex(([,a]) => t >= a))]);
};
</script></body></html>
