<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- MUESTRA TECNICA del motor HTML (no es un video real ni una idea que se pueda copiar): enseña como se usa cada recurso. -->
<link rel="stylesheet" href="jdt.css"><script src="jdt.js"></script></head>
<body>
<div id="vol" class="capa"></div>
<div id="e1" class="capa"><div id="t1" class="titulo" style="position:absolute;left:80px;top:430px;font-size:110px;width:920px"></div>
  <div id="p1" class="vidrio" style="left:110px;top:900px;width:860px;height:560px;padding:46px"><div id="c1" class="codigo"></div></div></div>
<div id="e2" class="capa"><div id="w2" class="titulo" style="position:absolute;left:0;right:0;top:760px;text-align:center;font-size:190px;mix-blend-mode:difference;color:#fff"></div>
  <div id="s2" class="mono" style="position:absolute;left:0;right:0;top:1440px;text-align:center"></div></div>
<div id="e3" class="capa"><div id="w3" class="titulo" style="position:absolute;left:0;right:0;top:420px;text-align:center;font-size:150px"></div></div>
<div id="e4" class="capa"><div id="tira" style="position:absolute;left:0;top:520px;width:3240px;height:1000px">
  <div class="vidrio oro" style="left:90px;top:0;width:900px;height:860px;padding:60px"><div class="mono">01 · Lo primero</div><div id="n4" class="titulo clave" style="font-size:210px;margin-top:70px"></div><div class="titulo" style="font-size:64px;margin-top:20px">dato de ejemplo</div></div>
  <div class="vidrio" style="left:1170px;top:0;width:900px;height:860px;padding:60px"><div class="mono">02 · Lo segundo</div><div class="titulo" style="font-size:96px;margin-top:80px">Se arma <span class="clave">solo</span></div></div>
  <div class="vidrio" style="left:2250px;top:0;width:900px;height:860px;padding:60px"><div class="mono">03 · Lo tercero</div><div class="titulo" style="font-size:96px;margin-top:80px">Y <span class="clave">listo</span> ✓</div></div></div></div>
<div id="e5" class="capa"><img id="logo" src="../recursos/logo.jpeg" style="position:absolute;left:290px;top:560px;width:500px;border-radius:90px">
  <div id="n5" class="titulo" style="position:absolute;left:0;right:0;top:1160px;text-align:center;font-size:64px"></div></div>
<div id="e6" class="capa"><div id="c6" class="titulo" style="position:absolute;left:0;right:0;top:700px;text-align:center;font-size:128px">Hablemos<br>de tu <span class="oro">proyecto</span></div>
  <div style="position:absolute;left:0;right:0;top:1200px;text-align:center"><span class="pildora">@technologicsjdt</span></div></div>
<div id="hud" class="hud"></div><div id="fl" class="capa" style="background:#fff;opacity:0;z-index:7"></div>
<script>
const {seg, E, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0), fg = JDT.lienzo(5); document.getElementById("vol").remove();
window.DURACION = 24;
const L3 = JDT.letras($("w3"), "Desarmamos.");
const CODIGO = '<b class="k">const</b> idea = {\n  <b class="n">para</b>: "tu negocio",\n  <b class="n">hace</b>: "lo repetitivo",\n};\n<b class="s">// se escribe solo</b>';
const dentro = (t, a, b) => t >= a && t < b;
window.render = (t) => {
  const escenas = [["e1", 0, 4.2], ["e2", 4, 8.2], ["e3", 8, 12.2], ["e4", 12, 16.2], ["e5", 16, 19.2], ["e6", 19, 24]];
  escenas.forEach(([id, a, b]) => $(id).style.display = dentro(t, a, b) ? "block" : "none");
  JDT.fondo(bg, t);
  // E1: titulo con mascara + panel de vidrio 3D que escribe codigo
  if (dentro(t, 0, 4.2)) {
    $("t1").innerHTML = 'Antes de la <span class="clave">app.</span>'; JDT.revelar($("t1"), seg(t, .5, 1.3, "outExpo"));
    JDT.camara($("p1"), {ry: lerp(-28, -12, seg(t, 0, 4, "inOutCubic")), rx: 8, y: lerp(120, 0, seg(t, .2, 1.2)), s: lerp(.9, 1, seg(t, 0, 1))});
    $("p1").style.opacity = seg(t, .3, 1, "lineal"); JDT.tipear($("c1"), CODIGO, seg(t, 1, 3.4, "lineal"));
    const k = seg(t, 0, .6, "outExpo"); bg.fillStyle = "rgba(255,255,255,.9)"; bg.fillRect(W() * (.5 - .5 * k), 960, W() * k, 3);
  }
  // E2: metaball de vidrio + palabras gigantes en blend difference que se reemplazan
  if (dentro(t, 4, 8.2)) {
    JDT.metaballs(bg, t, {x: .5, y: .45, r: 150, n: 4, k: seg(t, 4, 5, "outBack")});
    const pal = ["IDEA", "FORMA", "REAL"], i = Math.min(2, Math.floor((t - 4.2) / 1.3));
    $("w2").textContent = pal[Math.max(0, i)]; JDT.desenfoque($("w2"), 14 * (1 - seg(t, 4.2 + Math.max(0, i) * 1.3, 4.2 + Math.max(0, i) * 1.3 + .25)));
    $("s2").textContent = "// " + ["tu punto de partida", "le damos estructura", "y sale al mundo"][Math.max(0, i)];
  }
  // E3: rejilla en perspectiva + letras que se desarman y camino dorado que se dibuja
  if (dentro(t, 8, 12.2)) {
    const circ = seg(t, 8, 9, "outExpo"); JDT.rejilla(bg, t, {camino: seg(t, 9.5, 11.5, "inOutCubic"), alfa: circ});
    const k = seg(t, 10.3, 11.4, "inExpo");
    L3.forEach((s, i) => { const a = JDT.rnd(i + 3) * 6.28; s.style.transform = `translate(${Math.cos(a) * 520 * k}px,${Math.sin(a) * 420 * k}px) rotate(${(JDT.rnd(i) - .5) * 260 * k}deg)`; s.style.opacity = 1 - k; });
    $("w3").style.opacity = seg(t, 8.2, 8.7, "lineal");
  }
  // E4: tira horizontal con paneos rapidos y desenfoque de movimiento
  if (dentro(t, 12, 16.2)) {
    const p = seg(t, 12.2, 15.6, (x) => x < .5 ? 0 : x < .75 ? E.inOutCubic((x - .5) * 4) : 1) * 0 + (t < 13.4 ? 0 : t < 14.2 ? E.inOutCubic((t - 13.4) / .8) : t < 14.9 ? 1 : t < 15.7 ? 1 + E.inOutCubic((t - 14.9) / .8) : 2);
    const v = Math.abs(p % 1 - .5) < .5 ? (t > 13.4 && t < 14.2 || t > 14.9 && t < 15.7 ? 1 : 0) : 0;
    $("tira").style.transform = `translateX(${-p * 1080}px)`; JDT.desenfoque($("tira"), 0); $("tira").style.filter = v ? `blur(${6 * Math.sin(Math.PI * ((t - 13.4) % 1.5 / .8))}px)` : "none";
    $("n4").textContent = Math.round(24580 * seg(t, 12.4, 13.3, "outExpo")).toLocaleString("es-CO");
  }
  // E5: glitch del anterior, logo con aberracion que se estabiliza y nombre letra por letra
  if (dentro(t, 16, 19.2)) {
    const ab = 1 - seg(t, 16.1, 17.1, "outExpo"); JDT.glitch($("logo"), ab, Math.floor(t * 30));
    $("logo").style.opacity = seg(t, 16, 16.25, "lineal");
    $("n5").style.letterSpacing = ".35em"; $("n5").textContent = "JDT TECHNOLOGICS".slice(0, Math.round(16 * seg(t, 17.2, 18.4, "lineal"))); $("n5").style.opacity = 1;
  }
  if (dentro(t, 19, 24)) { $("c6").style.opacity = seg(t, 19.2, 19.9, "outQuart"); $("c6").style.transform = `translateY(${lerp(60, 0, seg(t, 19.2, 20, "outExpo"))}px)`; }
  // barrido entre capitulos y destello
  const b = [3.9, 7.9, 11.9, 15.9]; let kb = 0; b.forEach(x => { if (t > x && t < x + .8) kb = (t - x) / .4; });
  fg.clearRect(0, 0, JDT.W, JDT.H); JDT.barrido(fg, kb); JDT.grano(fg, t, .05);
  JDT.flash($("fl"), t > 16 && t < 16.2 ? 1 - (t - 16) / .2 : 0);
  JDT.hud($("hud"), t, 24, ["01 · APERTURA", "02 · LA IDEA", "03 · MÉTODO", "04 · SERVICIOS", "05 · MARCA", "06 · CIERRE"][Math.max(0, escenas.findLastIndex(([, a]) => t >= a))]);
};
function W() { return JDT.W; }
</script></body></html>
