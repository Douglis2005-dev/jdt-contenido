<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="jdt.css"><script src="jdt.js"></script>
<style>
  html, body { background: #0A0E27; }
  .txt { position: absolute; left: 60px; right: 60px; top: 250px; height: 360px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 900; font-size: 96px; line-height: 1.06; letter-spacing: -0.02em; }
  .fila { position: absolute; left: 60px; width: 700px; height: 120px; border-radius: 18px; background: rgba(19,26,58,.92); border: 2px solid rgba(148,163,184,.35); }
  .fila .lbl { position: absolute; left: 34px; top: 34px; font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 26px; letter-spacing: .14em; color: #94A3B8; text-transform: uppercase; }
  .fila .bar { position: absolute; left: 34px; bottom: 26px; height: 10px; width: 600px; background: rgba(148,163,184,.18); border-radius: 5px; overflow: hidden; }
  .fila .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #FACC15; border-radius: 5px; width: 0; }
  .tira { position: absolute; left: 60px; width: 680px; height: 96px; border-radius: 18px; background: rgba(19,26,58,.95); border: 2px solid rgba(148,163,184,.4); color: #94A3B8; font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 34px; line-height: 96px; padding-left: 36px; letter-spacing: .04em; }
  .sello { position: absolute; left: 50%; top: 600px; transform: translateX(-50%); }
</style></head>
<body>
<div id="chat" class="pildora" style="position:absolute;left:340px;top:1400px;z-index:4;font-size:34px;opacity:0;white-space:nowrap">¿Me pasas el precio?</div>
<div id="gl" style="position:absolute;left:440px;top:860px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#FACC15 0%,rgba(250,204,21,0) 62%);opacity:0;z-index:2"></div>

<div id="p" class="vidrio" style="left:140px;top:640px;width:800px;height:720px;z-index:3;overflow:hidden;opacity:0">
  <div id="t1" class="tira" style="top:110px;opacity:0">Lista de precios vieja</div>
  <div id="t2" class="tira" style="top:260px;opacity:0">Precio pedido por chat</div>
  <div id="t3" class="tira" style="top:410px;opacity:0">Cotización sin enviar</div>

  <div id="f1" class="fila" style="top:120px;opacity:0"><div class="lbl">Producto · Referencia A</div><div class="bar"><i id="b1"></i></div></div>
  <div id="f2" class="fila" style="top:260px;opacity:0"><div class="lbl">Cantidad · Según pedido</div><div class="bar"><i id="b2"></i></div></div>
  <div id="f3" class="fila" style="top:400px;opacity:0"><div class="lbl">Entrega · Fecha incluida</div><div class="bar"><i id="b3"></i></div></div>
  <div id="f4" class="fila" style="top:540px;opacity:0"><div class="lbl">Total · Calculado ✓</div><div class="bar"><i id="b4"></i></div></div>
  <div id="enc" style="position:absolute;left:60px;top:44px;font-family:'DejaVu Sans Mono',Consolas,monospace;font-size:28px;letter-spacing:.14em;color:#FACC15;opacity:0">COTIZADOR A MEDIDA</div>
  <div id="sello" class="pildora" style="position:absolute;right:30px;top:30px;font-size:30px;padding:12px 26px;opacity:0">Cotización lista ✓</div>

  <div id="cierre" class="titulo" style="position:absolute;left:0;right:0;top:250px;text-align:center;font-size:44px;letter-spacing:.2em;color:#FACC15;opacity:0">JDT TECHNOLOGICS</div>

  <div id="refl" style="position:absolute;inset:0;border-radius:36px;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);z-index:4;pointer-events:none"></div>
  <div id="fr" style="position:absolute;left:0;top:0;width:100%;height:100%;border-radius:36px;background:rgba(255,255,255,0);z-index:5"></div>
</div>

<div id="wp" style="position:absolute;left:140px;top:640px;width:10px;height:720px;transform-origin:50% 100%;background:#FACC15;box-shadow:0 0 40px 12px rgba(250,204,21,.6);opacity:0;z-index:6"></div>

<div id="hd" class="txt" style="z-index:7;color:#FFFFFF"></div>

<div id="pie" style="position:absolute;left:0;right:0;top:1420px;text-align:center;z-index:7;opacity:0"><span class="pildora" style="font-size:52px;padding:22px 56px">@technologicsjdt</span></div>

<div id="hud" class="hud" style="z-index:8"></div>
<script>
const {seg, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0);
const DUR = 19.34;
window.DURACION = DUR;

const H = [
  [0.00, 2.71, '¿Te piden precio y respondes <span class="clave">mañana</span>?'],
  [2.71, 4.60, 'Buscas la lista… <span class="clave">copias</span>.'],
  [4.60, 6.30, '<span class="clave">Pegas.</span> Revisas.'],
  [6.30, 9.75, 'Uy, no… el cliente ya le compró a <span class="clave">otro</span>.'],
  [9.75, 13.83, 'Un <span class="clave">cotizador a medida</span>, hecho por JDT.'],
  [13.83, 16.71, 'Eliges producto. La cotización <span class="clave">sale sola</span>.'],
  [16.71, 19.34, '<span class="clave">Hablemos</span> de tu proyecto.'],
];
const ESC = [[0, 'PRECIO'], [2.71, 'CONFLICTO'], [9.75, 'GIRO'], [13.83, 'PRODUCTO'], [16.71, 'CIERRE']];

const hd = $("hd"); let ultimoHd = null;
function textoEn(t) {
  for (const [a, b, h] of H) if (t >= a && t < b) return [a, h];
  return [H[H.length - 1][0], H[H.length - 1][2]];
}

window.render = (t) => {
  // HUD con el nombre de la escena
  let nombre = ESC[0][1];
  for (const [a, n] of ESC) if (t >= a) nombre = n;
  JDT.hud($("hud"), t, DUR, nombre);

  // Titular: aparece con fade + desplazamiento al cambiar de frase
  const [a, h] = textoEn(t);
  if (ultimoHd !== a) { hd.innerHTML = "<div>" + h + "</div>"; ultimoHd = a; }
  const k = a === 0 ? 1 : seg(t, a, a + 0.4, "outExpo");
  hd.style.opacity = k;
  hd.style.transform = `translateY(${(1 - k) * 26}px)`;

  // Panel de vidrio: entra en el gancho y gira suave en 3D
  const pk = 1;
  const p = $("p");
  p.style.opacity = pk;
  let ry = 2 * Math.sin(t * 0.4);
  if (t >= 9.75) ry += lerp(-9, 0, seg(t, 9.75, 11.5, "outExpo"));
  const rx = 5 * Math.sin(t * 0.6);
  $("refl").style.transform = `translateX(${(((t * 0.25) % 1) * 1.6 - 0.8) * 800}px)`;
  JDT.camara(p, { rx, ry, persp: 1600 });

  // Luz dorada del cliente: se aleja mientras se empaña, vuelve al cierre
  const gl = $("gl");
  let gx = 0, gs = 1, go = 0;
  if (t < 3.0) { go = 1; }
  else if (t < 8.6) { const q = seg(t, 3.0, 8.6, "inOutCubic"); gx = lerp(0, 260, q); gs = lerp(1, 0.5, q); go = lerp(1, 0.22, q); }
  else if (t < 9.7) { gx = 260; gs = 0.5; go = 0.22; }
  else if (t < 16.7) { go = 0; }
  else { go = seg(t, 16.71, 17.6, "outExpo") * 0.9; }
  gl.style.opacity = go;
  gl.style.transform = `translate(${gx}px,0) scale(${gs})`;
  const ch = $("chat");
  let co = 0, ctxt = "¿Me pasas el precio?";
  if (t < 6.3) co = 1; else if (t < 8.6) { co = lerp(1, 0.2, seg(t, 6.3, 8.6, "inOutCubic")); ctxt = "Gracias, ya lo tengo."; }
  else if (t < 16.7) { co = 0; } else { co = seg(t, 16.71, 17.4, "outExpo"); ctxt = "Perfecto, envíamela."; }
  if (ch.dataset.t !== ctxt) { ch.textContent = ctxt; ch.dataset.t = ctxt; }
  ch.style.opacity = co; ch.style.transform = t >= 16.7 ? "translate(0px,0)" : `translate(${gx * 0.6}px,0)`;
  ch.style.top = t >= 16.7 ? "1150px" : "1400px";
  ch.style.left = t >= 16.7 ? "50%" : "300px";
  ch.style.marginLeft = t >= 16.7 ? "-200px" : "0px";

  // Escena 2: listas viejas que se pegan al vidrio y lo empañan
  const cubre = seg(t, 3.0, 8.6, "inOutCubic");
  const fr = $("fr");
  let wipe = 0;
  if (t >= 9.75) wipe = seg(t, 9.75, 10.7, "inOutCubic");
  const esco = (t >= 9.75 && t < 16.7) ? 0 : 1;
  fr.style.backdropFilter = `blur(${(cubre * 16).toFixed(2)}px)`;
  fr.style.webkitBackdropFilter = fr.style.backdropFilter;
  fr.style.background = `rgba(255,255,255,${(cubre * 0.34).toFixed(3)})`;
  fr.style.clipPath = t >= 9.75 ? `inset(0 0 0 ${(wipe * 100).toFixed(2)}%)` : "none";
  if (t >= 16.7) fr.style.opacity = 0;
  else fr.style.opacity = 1;
  const tiras = [["t1", 3.3], ["t2", 4.1], ["t3", 4.9]];
  tiras.forEach(([id, s], i) => {
    const el = $(id);
    const q = seg(t, s, s + 0.55, "outExpo");
    const fuera = t >= 9.75 ? 1 - seg(t, 9.75, 10.2, "inOutCubic") : 1;
    el.style.opacity = q * fuera;
    el.style.transform = `translateX(${(1 - q) * -260}px)`;
  });

  // Limpiaparabrisas dorado
  const wp = $("wp");
  const wOp = (t >= 9.75 && t < 10.75) ? 1 : 0;
  wp.style.opacity = wOp;
  wp.style.left = (140 + wipe * 800 - 5) + "px";
  wp.style.transform = `rotate(${lerp(-14, 14, wipe).toFixed(2)}deg)`;

  // Escena 4: filas genéricas que se dibujan y se ordenan
  $("enc").style.opacity = seg(t, 9.9, 10.4, "outExpo") * (t >= 16.7 ? 0 : 1);
  const filas = [["f1", "b1", 10.9], ["f2", "b2", 11.9], ["f3", "b3", 12.9], ["f4", "b4", 14.4]];
  filas.forEach(([fid, bid, s]) => {
    const q = seg(t, s, s + 0.45, "outExpo");
    const e = $(fid);
    e.style.opacity = q * (t >= 16.2 ? 1 - seg(t, 16.2, 16.6, "inOutCubic") : 1);
    e.style.transform = `translateY(${(1 - q) * 24}px)`;
    $(bid).style.width = (seg(t, s + 0.2, s + 1.1, "inOutCubic") * 100).toFixed(2) + "%";
  });
  const sel = seg(t, 15.6, 16.1, "outBack");
  $("sello").style.opacity = t >= 16.7 ? 0 : clamp(sel);
  $("sello").style.transform = `scale(${lerp(0.6, 1, sel).toFixed(3)})`;

  // Cierre dentro del panel y pildora de contacto
  const cz = seg(t, 16.71, 17.2, "outExpo");
  $("cierre").style.opacity = cz * (t >= 16.7 ? 1 : 0);
  $("pie").style.opacity = (t >= 9.75 && t < 16.7) ? 0.35 : seg(t, 17.6, 18.2, "outExpo");
  $("pie").style.transform = `translateY(${(1 - seg(t, 17.6, 18.2, "outExpo")) * 20}px)`;
};
</script>
</body></html>
