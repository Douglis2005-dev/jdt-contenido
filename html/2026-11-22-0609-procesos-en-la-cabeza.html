<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="jdt.css"><script src="jdt.js"></script></head>
<body>
<!-- Reel: "Lo que nadie documenta". Microdocumental en 5 planos, ritmo contemplativo, gancho nadie-te-cuenta. -->
<div id="s1" class="capa">
  <div id="anillo" style="position:absolute;left:50%;top:740px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;border:8px solid #FACC15;box-shadow:0 0 80px rgba(250,204,21,.35),inset 0 0 60px rgba(84,102,180,.35)"></div>
  <div id="h1" class="titulo" style="position:absolute;left:0;right:0;top:200px;text-align:center;font-size:104px;line-height:1.08"><div id="h1a"></div><div id="h1b"></div></div>
</div>

<div id="s2" class="capa">
  <div id="rot2" class="mono" style="position:absolute;left:0;right:0;top:250px;text-align:center;font-size:24px">Lunes · 8:00 a. m.</div>
  <svg id="lineas2" width="1080" height="1920" style="position:absolute;left:0;top:0"></svg>
  <div id="nodo2" class="vidrio" style="left:340px;top:780px;width:400px;height:200px;border-radius:999px;text-align:center;padding-top:62px;font-size:52px;font-weight:800;background:linear-gradient(145deg,rgba(250,204,21,.30),rgba(250,204,21,.08));border-color:rgba(250,204,21,.6)">Una persona</div>
  <div id="c2a" class="vidrio" style="left:90px;top:1120px;width:300px;height:220px;padding:34px 28px"><div class="mono" style="font-size:22px">Cotizar</div><div class="titulo" style="font-size:44px;margin-top:22px">Precios</div></div>
  <div id="c2b" class="vidrio" style="left:390px;top:1120px;width:300px;height:220px;padding:34px 28px"><div class="mono" style="font-size:22px">Facturar</div><div class="titulo" style="font-size:44px;margin-top:22px">Cobros</div></div>
  <div id="c2c" class="vidrio" style="left:690px;top:1120px;width:300px;height:220px;padding:34px 28px"><div class="mono" style="font-size:22px">Responder</div><div class="titulo" style="font-size:44px;margin-top:22px">Fallas</div></div>
  <div id="h2" class="titulo" style="position:absolute;left:0;right:0;top:380px;text-align:center;font-size:96px;line-height:1.05"></div>
</div>

<div id="s3" class="capa">
  <div id="cal3" class="vidrio" style="left:110px;top:520px;width:860px;height:380px;padding:44px">
    <div class="mono" style="font-size:24px">Vacaciones</div>
    <div id="grid3" style="display:grid;grid-template-columns:repeat(7,1fr);gap:16px;margin-top:40px"></div>
  </div>
  <div id="t3a" class="vidrio" style="left:150px;top:1010px;width:780px;height:150px;padding:0 48px;display:flex;align-items:center;background:linear-gradient(145deg,rgba(148,163,184,.30),rgba(148,163,184,.08));border-color:rgba(148,163,184,.5)"><div class="titulo" style="font-size:52px;color:#94A3B8">Cotización en espera</div></div>
  <div id="t3b" class="vidrio" style="left:220px;top:1200px;width:780px;height:150px;padding:0 48px;display:flex;align-items:center;background:linear-gradient(145deg,rgba(148,163,184,.30),rgba(148,163,184,.08));border-color:rgba(148,163,184,.5)"><div class="titulo" style="font-size:52px;color:#94A3B8">Factura sin enviar</div></div>
  <div id="h3" class="titulo" style="position:absolute;left:0;right:0;top:1480px;text-align:center;font-size:92px"></div>
  <div id="h3b" class="titulo" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:96px;line-height:1.08">Y se va de <span class="clave">vacaciones</span></div>
</div>

<div id="pers" class="capa" style="background:#0A0E27;z-index:4;display:none"></div>

<div id="s4" class="capa">
  <div id="amar4" class="capa" style="background:#FACC15;z-index:0"></div>
  <div id="doc4" class="vidrio" style="left:250px;top:620px;width:580px;height:700px;padding:56px;background:#0A0E27;border-color:#0A0E27;box-shadow:0 30px 90px rgba(10,14,39,.45)">
    <div class="mono" style="font-size:22px;color:#94A3B8">Documento</div>
    <div style="height:26px;background:#2A3460;border-radius:8px;margin-top:44px"></div>
    <div style="height:26px;background:#2A3460;border-radius:8px;margin-top:26px;width:82%"></div>
    <div style="height:26px;background:#2A3460;border-radius:8px;margin-top:26px;width:91%"></div>
    <div style="height:26px;background:#FACC15;border-radius:8px;margin-top:26px;width:60%"></div>
    <div style="height:26px;background:#2A3460;border-radius:8px;margin-top:26px;width:74%"></div>
  </div>
  <svg id="lineas4" width="1080" height="1920" style="position:absolute;left:0;top:0"></svg>
  <div id="carp4" class="vidrio" style="left:90px;top:1420px;width:330px;height:200px;padding:34px 30px;background:#0A0E27;border-color:#0A0E27"><div class="mono" style="font-size:22px;color:#94A3B8">Carpeta</div><div class="titulo" style="font-size:44px;margin-top:22px;color:#FACC15">Procesos</div></div>
  <div id="equi4" class="vidrio" style="left:660px;top:1420px;width:330px;height:200px;padding:34px 30px;background:#0A0E27;border-color:#0A0E27"><div class="mono" style="font-size:22px;color:#94A3B8">Equipo</div><div class="titulo" style="font-size:44px;margin-top:22px;color:#FACC15">Tu equipo</div></div>
  <div id="h4" class="titulo" style="position:absolute;left:0;right:0;top:300px;text-align:center;font-size:82px;line-height:1.08;color:#0A0E27"></div>
</div>

<div id="s5" class="capa">
  <img id="logo5" src="../recursos/logo.jpeg" style="position:absolute;left:390px;top:420px;width:300px;border-radius:60px">
  <div id="h5" class="titulo" style="position:absolute;left:0;right:0;top:860px;text-align:center;font-size:96px;line-height:1.08"><div id="h5a"></div><div id="h5b" class="clave"></div></div>
  <div id="pil5" style="position:absolute;left:0;right:0;top:1190px;text-align:center"><span class="pildora">@technologicsjdt</span></div>
</div>

<div id="hud" class="hud"></div>
<script>
const {seg, E, clamp, lerp} = JDT; const $ = id => document.getElementById(id);
const bg = JDT.lienzo(0);
window.DURACION = 23.82;
const dentro = (t, a, b) => t >= a && t < b;
const ESC = [["s1",0,2.94],["s2",2.94,9.83],["s3",9.83,14.23],["s4",14.23,21.03],["s5",21.03,23.82]];
const L1 = [...JDT.letras($("h1a"), "Lo que nadie"), ...JDT.letras($("h1b"), "te cuenta")];
const L2 = JDT.letras($("h2"), "¿Quién sabe cotizar?");
const L3 = JDT.letras($("h3"), "Todo se queda quieto.");
const L5 = [...JDT.letras($("h5a"), "Hablemos de"), ...JDT.letras($("h5b"), "tu proyecto.")];
const GRID = $("grid3");
for (let i = 0; i < 14; i++) { const d = document.createElement("div"); d.style.cssText = "height:44px;border-radius:10px;background:rgba(148,163,184,.18)"; GRID.appendChild(d); }
const svgNS = "http://www.w3.org/2000/svg";
function linea(svg, x1, y1, x2, y2, p) {
  const l = document.createElementNS(svgNS, "line");
  l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  l.setAttribute("stroke", "#FACC15"); l.setAttribute("stroke-width", "4"); l.setAttribute("stroke-dasharray", "10 12");
  l.setAttribute("stroke-dashoffset", String((1 - p) * 60)); l.setAttribute("opacity", String(clamp(p * 1.4)));
  svg.appendChild(l);
}
function reset(svg) { svg.innerHTML = ""; }

window.render = (t) => {
  ESC.forEach(([id, a, b]) => $(id).style.display = dentro(t, a, b) ? "block" : "none");
  JDT.fondo(bg, t);
  JDT.hud($("hud"), t, 23.82, t < 2.94 ? "Hook" : t < 9.83 ? "Contexto" : t < 14.23 ? "Problema" : t < 21.03 ? "Giro" : "Cierre");

  // ESCENA 1 (gancho): titulo con letras, anillo dorado que entra y un glitch corto (unico golpe fuerte)
  if (dentro(t, 0, 2.94)) {
    L1.forEach((el, i) => { const p = seg(t, 0.05 + i * 0.03, 0.5 + i * 0.03); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 40}px)`; });
    const an = $("anillo"), pa = seg(t, 0.2, 1.1, "outBack");
    an.style.transform = `scale(${0.6 + 0.4 * pa}) rotate(${t * 18}deg)`; an.style.opacity = clamp(pa * 1.2);
  }

  // ESCENA 2 (contexto): un solo nodo del que cuelgan tres saberes con hilos punteados
  if (dentro(t, 2.94, 9.83)) {
    const u = t - 2.94;
    const svg = $("lineas2");
    reset(svg);
    const p0 = seg(u, 0.4, 1.2), p1 = seg(u, 1.0, 1.9), p2 = seg(u, 1.4, 2.3), p3 = seg(u, 1.8, 2.7);
    linea(svg, 540, 980, 240, 1120, p1);
    linea(svg, 540, 980, 540, 1120, p2);
    linea(svg, 540, 980, 840, 1120, p3);
    const n = $("nodo2"); n.style.opacity = clamp(p0 * 1.3); n.style.transform = `scale(${0.9 + 0.1 * p0})`;
    ["c2a", "c2b", "c2c"].forEach((id, i) => { const p = seg(u, 1.0 + i * 0.4, 1.8 + i * 0.4); $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * 50}px)`; });
    $("rot2").style.opacity = seg(u, 0.0, 0.6);
    $("s2").style.transform = `scale(${1 + 0.02 * (u / 6.9)})`;
    const h = $("h2"); const L = L2; L.forEach((el, i) => { const p = seg(u, 0.2 + i * 0.03, 0.6 + i * 0.03); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 30}px)`; });
    if (u > 3.2) { h.style.opacity = clamp(1 - (u - 3.2) / 0.5); }
  }

  // ESCENA 3 (problema + pausa): persiana de entrada, calendario con vibracion breve y tarjetas grises
  if (dentro(t, 9.83, 14.23)) {
    const u = t - 9.83;
    const cubre = seg(t, 9.83, 10.3);
    const pers = $("pers"); pers.style.display = t < 10.3 ? "block" : "none"; pers.style.height = `${(1 - cubre) * 100}%`; pers.style.bottom = "auto"; pers.style.top = "0";
    const sh = dentro(u, 0.2, 0.5) ? Math.sin(u * 70) * 8 * (1 - (u - 0.2) / 0.3) : 0;
    const cal = $("cal3"); cal.style.transform = `translateX(${sh}px)`; cal.style.opacity = seg(u, 0.1, 0.6);
    const cells = GRID.children; for (let i = 0; i < cells.length; i++) cells[i].style.background = (i === 9 || i === 10) ? `rgba(250,204,21,${0.2 + 0.6 * seg(u, 0.4, 1.2)})` : "rgba(148,163,184,.18)";
    const a = $("t3a"), b = $("t3b");
    const pa = seg(u, 0.8, 1.5), pb = seg(u, 1.6, 2.3);
    a.style.opacity = pa; a.style.transform = `translateX(${(1 - pa) * 160}px)`;
    b.style.opacity = pb; b.style.transform = `translateX(${(1 - pb) * 160}px)`;
    const hb = $("h3b"); hb.style.opacity = seg(u, 0.2, 0.7) * (1 - seg(u, 3.4, 4.0)); hb.style.transform = `translateY(${(1 - seg(u, 0.2, 0.7)) * 30}px)`;
    const h = $("h3"); const pt = seg(u, 2.4, 3.2);
    L3.forEach((el, i) => { const q = clamp(pt * 1.0 - i * 0.01); el.style.opacity = q; });
  }

  // ESCENA 4 (giro): fondo amarillo que se abre en circulo, documento que reparte el saber a una carpeta y a un equipo
  if (dentro(t, 14.23, 21.03)) {
    const u = t - 14.23;
    const amar = $("amar4");
    const r = seg(t, 14.23, 14.9) * 150;
    const fade = 1 - seg(t, 17.5, 18.0);
    amar.style.clipPath = `circle(${r}% at 50% 40%)`; amar.style.opacity = fade;
    const svg = $("lineas4"); reset(svg);
    const ps = seg(u, 0.8, 1.8), pc = seg(u, 1.6, 2.6), pe = seg(u, 2.0, 3.0);
    linea(svg, 540, 1320, 255, 1420, ps);
    linea(svg, 540, 1320, 825, 1420, pe);
    const d = $("doc4"); d.style.transform = `translateY(${(1 - seg(u, 0.2, 0.9)) * 60}px)`;
    $("carp4").style.opacity = pc; $("carp4").style.transform = `translateY(${(1 - pc) * 40}px)`;
    $("equi4").style.opacity = pe; $("equi4").style.transform = `translateY(${(1 - pe) * 40}px)`;
    const h = $("h4"); h.style.display = "block";
    h.innerHTML = 'El saber, <span style="font-weight:900">escrito</span>: visible y ordenado';
    const hp = seg(u, 0.4, 1.1); h.style.opacity = hp * fade; h.style.transform = `translateY(${(1 - hp) * 30}px)`;
    const lo = clamp(1 - (t - 21.0) / 0.1);
    if (t > 20.7) { h.style.opacity = 0; }
  }

  // ESCENA 5 (cierre): logo, llamado a la accion y @technologicsjdt
  if (dentro(t, 21.03, 23.82)) {
    const u = t - 21.03;
    const lg = $("logo5"); lg.style.opacity = seg(u, 0.0, 0.5); lg.style.transform = `scale(${0.92 + 0.08 * seg(u, 0.0, 0.6)})`;
    L5.forEach((el, i) => { const p = seg(u, 0.3 + i * 0.02, 0.8 + i * 0.02); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 30}px)`; });
    $("pil5").style.opacity = seg(u, 0.8, 1.2);
  }
};
</script>
</body></html>
